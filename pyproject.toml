[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "msoc"
version = "0.2.1"
description = "Быстрый поисковик музыки"
readme = "README.md"
requires-python = ">=3.12,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "textual (>=8.2.8,<9.0.0)",
    "textual-dev (>=1.8.0,<2.0.0)",
    "sounddevice (>=0.5.5,<0.6.0)",
    "bs4 (>=0.0.2,<0.0.3)",
    "aiohttp (>=3.14.1,<4.0.0)",
    "lxml (>=6.1.1,<7.0.0)",
]

[project.urls]
GitHub = "https://github.com/paranoik1/msoc"

[project.scripts]
msoc = "msoc.__main__:execute"

[tool.poetry]
package-mode = true

[dependency-groups]
dev = [
    "black>=24.0",
    "mypy>=1.8",
    "isort (>=8.0.1,<9.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "memray (>=1.19.3,<2.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
